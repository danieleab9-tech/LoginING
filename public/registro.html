<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Crear cuenta</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <main class="tarjeta">
    <div class="logo">IS</div>
    <h1>Crear cuenta</h1>
    <p class="sub">Completa tus datos para registrarte.</p>

    <form id="form-registro" novalidate>
      <label for="nombre">Nombre completo</label>
      <input id="nombre" type="text" autocomplete="name" required maxlength="80">

      <label for="email">Correo electrónico</label>
      <input id="email" type="email" autocomplete="email" required maxlength="120">

      <label for="password">Contraseña</label>
      <input id="password" type="password" autocomplete="new-password" required>
      <p class="ayuda">Mínimo 8 caracteres, con mayúscula, minúscula y número.</p>

      <label for="confirmar">Confirmar contraseña</label>
      <input id="confirmar" type="password" autocomplete="new-password" required>

      <button id="btn" type="submit">Crear cuenta</button>
      <div id="mensaje" class="mensaje" role="alert"></div>
    </form>

    <p class="pie">¿Ya tienes cuenta? <a href="/">Inicia sesión</a></p>
  </main>

  <script src="/js/app.js"></script>
  <script>
    document.getElementById('form-registro').addEventListener('submit', async (e) => {
      e.preventDefault();
      const body = {
        nombre: document.getElementById('nombre').value.trim(),
        email: document.getElementById('email').value.trim(),
        password: document.getElementById('password').value,
        confirmar: document.getElementById('confirmar').value,
      };
      if (body.password !== body.confirmar) return mostrarMensaje('Las contraseñas no coinciden.');

      const btn = document.getElementById('btn');
      btn.disabled = true; btn.textContent = 'Creando…';
      const r = await api('/api/registro', { method: 'POST', body });
      btn.disabled = false; btn.textContent = 'Crear cuenta';

      if (r.ok) {
        mostrarMensaje(r.datos.mensaje + ' Redirigiendo…', 'ok');
        setTimeout(() => (location.href = '/'), 1500);
      } else {
        mostrarMensaje(r.datos.error || 'No se pudo crear la cuenta.');
      }
    });
  </script>
</body>
</html>
