<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesión</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <main class="tarjeta">
    <div class="logo">IS</div>
    <h1>Iniciar sesión</h1>
    <p class="sub">Ingresa con tu correo y contraseña.</p>

    <form id="form-login" novalidate>
      <label for="email">Correo electrónico</label>
      <input id="email" name="email" type="email" autocomplete="username" required>

      <label for="password">Contraseña</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>

      <button id="btn" type="submit">Entrar</button>
      <div id="mensaje" class="mensaje" role="alert"></div>
    </form>

    <p class="pie">¿No tienes cuenta? <a href="/registro.html">Regístrate</a></p>
  </main>

  <script src="/js/app.js"></script>
  <script>
    // Si ya hay sesión activa, ir directo al panel
    api('/api/sesion').then(r => { if (r.ok) location.href = '/panel.html'; });

    document.getElementById('form-login').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      if (!email || !password) return mostrarMensaje('Ingresa tu correo y contraseña.');

      const btn = document.getElementById('btn');
      btn.disabled = true; btn.textContent = 'Verificando…';
      const r = await api('/api/login', { method: 'POST', body: { email, password } });
      btn.disabled = false; btn.textContent = 'Entrar';

      if (r.ok) location.href = '/panel.html';
      else mostrarMensaje(r.datos.error || 'No se pudo iniciar sesión.');
    });
  </script>
</body>
</html>
